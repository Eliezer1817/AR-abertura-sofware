<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR abertura sofware</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --card: rgba(255,255,255,0.08);
      --text: #eaf0ff;
      --muted: #b8c3e6;
      --accent: #7c9cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #182447 0%, var(--bg) 55%);
      color: var(--text);
    }
    .card {
      width: min(92vw, 760px);
      padding: 48px 28px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(16px);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 4rem); }
    p { margin: 0; color: var(--muted); font-size: clamp(1rem, 2.2vw, 1.2rem); line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(124,156,255,0.16);
      color: var(--accent);
      font-weight: 700;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">GitHub Pages Ready</div>
    <h1>AR abertura sofware</h1>
    <p>Este proyecto HTML está listo para publicarse en GitHub Pages y verse directamente en la web.</p>
  </main>
</body>
</html>
